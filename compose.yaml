services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: fanout
      POSTGRES_USER: fanout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fanout-local-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fanout -d fanout"]
      interval: 2s
      timeout: 3s
      retries: 30
  fanout-worker: &worker
    build: .
    image: template-fanout-worker:local
    environment: &worker-environment
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fanout
      SPRING_DATASOURCE_USERNAME: fanout
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-fanout-local-only}
      FANOUT_REGION: EU
      FANOUT_DEMO_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 30s
    restart: unless-stopped
  fanout-demo:
    <<: *worker
    profiles: [demo]
    environment:
      <<: *worker-environment
      FANOUT_DEMO_ENABLED: "true"
    # Explicit finite demo; ordinary compose up starts only the continuous worker.
    restart: "no"

volumes:
  postgres-data:
