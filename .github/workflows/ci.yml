name: Verify and prepare environments

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Environment to prepare (no deployment)
        required: true
        default: none
        type: choice
        options:
          - none
          - QA
          - PROD
      publish_image:
        description: Publish the tested image after environment validation
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.target_environment || 'none' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  validate_request:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check environment preparation request
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          PUBLISH_IMAGE: ${{ inputs.publish_image }}
          CURRENT_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != workflow_dispatch ]]; then
            exit 0
          fi
          case "$TARGET_ENVIRONMENT" in
            none|QA|PROD) ;;
            *) echo 'Invalid target environment.' >&2; exit 1 ;;
          esac
          if [[ "$TARGET_ENVIRONMENT" != none && "$CURRENT_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo 'Prepare QA/PROD from the default branch only.' >&2
            exit 1
          fi
          if [[ "$PUBLISH_IMAGE" == true && "$TARGET_ENVIRONMENT" == none ]]; then
            echo 'Select QA or PROD before publishing an image.' >&2
            exit 1
          fi

  unit_tests:
    needs: validate_request
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test environment configuration validation
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Run unit tests without a database service or credentials
        run: mvn --batch-mode --no-transfer-progress test
      - name: Retain unit test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-reports
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7

  verify:
    needs: unit_tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: fanout_test
          POSTGRES_USER: fanout
          POSTGRES_PASSWORD: fanout-ci-only
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U fanout -d fanout_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:55432/fanout_test
      TEST_DATABASE_USERNAME: fanout
      TEST_DATABASE_PASSWORD: fanout-ci-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run full verification including PostgreSQL integration tests
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 7
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build Linux image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: template-fanout-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Smoke-test continuous worker and persistent restart
        run: bash scripts/smoke-container.sh template-fanout-worker:ci
      - name: Export the tested image
        run: docker save template-fanout-worker:ci | gzip > target/container-image.tar.gz
      - name: Retain deployable artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: application-and-image
          path: |
            target/template-fanout-worker-1.0.0.jar
            target/container-image.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  prepare_qa:
    name: Prepare QA configuration
    if: github.event_name == 'workflow_dispatch' && inputs.target_environment == 'QA' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: QA
      deployment: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate QA settings without connecting to its database
        env:
          TARGET_ENVIRONMENT: QA
          SPRING_PROFILES_ACTIVE: qa
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          FANOUT_REGION: ${{ vars.FANOUT_REGION }}
        run: python3 .github/scripts/validate_environment.py

  prepare_prod:
    name: Prepare PROD configuration
    if: github.event_name == 'workflow_dispatch' && inputs.target_environment == 'PROD' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: PROD
      deployment: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate PROD settings without connecting to its database
        env:
          TARGET_ENVIRONMENT: PROD
          SPRING_PROFILES_ACTIVE: prod
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          FANOUT_REGION: ${{ vars.FANOUT_REGION }}
        run: python3 .github/scripts/validate_environment.py

  publish:
    if: >-
      always() && !cancelled() && github.event_name == 'workflow_dispatch' && inputs.publish_image &&
      needs.verify.result == 'success' &&
      (needs.prepare_qa.result == 'success' || needs.prepare_prod.result == 'success')
    needs: [verify, prepare_qa, prepare_prod]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: application-and-image
          path: artifacts
      - name: Publish the exact image tested by CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPOSITORY,,}:sha-${COMMIT_SHA}-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gzip -dc artifacts/container-image.tar.gz | docker load
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker tag template-fanout-worker:ci "$image"
          docker push "$image"
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")"
          printf 'Prepared for %s. Published `%s`\n\nDigest: `%s`\n\nNo deployment was performed.\n' \
            "$TARGET_ENVIRONMENT" "$image" "$digest" >> "$GITHUB_STEP_SUMMARY"
